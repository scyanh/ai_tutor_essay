[project]
name = "essay-tutor-backend"
version = "0.1.0"
description = "Backend con Google ADK para tutor inteligente de ensayos con PostgreSQL y RAG en Vertex AI Search"
authors = [
    {name = "Sharon Dev Team", email = "dev@example.com"},
]
dependencies = [
    "google-adk[bigquery-analytics,gcp,otel-gcp]>=2.7.0,<2.9.0",
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-discoveryengine>=0.11.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "asyncpg>=0.31.0",
    "pyjwt>=2.15.1",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "sqlalchemy[asyncio]>=2.0.25",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["essay_tutor", "db", "services"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
